<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <style>
    /* xhtml2pdf : mise en page par frames (header / contenu / footer répétés
       sur chaque page). Pas de flexbox ni de SVG — on s'appuie sur des tables. */
    @page {
      size: a4 portrait;
      margin: 3.1cm 1.6cm 2.3cm 1.6cm;

      @frame header_frame {
        -pdf-frame-content: header_content;
        top: 0.9cm; left: 1.6cm; width: 17.8cm; height: 2.2cm;
      }
      @frame content_frame {
        top: 3.1cm; left: 1.6cm; width: 17.8cm; height: 23.3cm;
      }
      @frame footer_frame {
        -pdf-frame-content: footer_content;
        bottom: 0.9cm; left: 1.6cm; width: 17.8cm; height: 1.1cm;
      }
    }

    body {
      font-family: Helvetica, Arial, sans-serif;
      color: #333333;
      font-size: 10.5px;
      line-height: 1.45;
    }

    /* ---------- En-tête ---------- */
    table.brandbar { width: 100%; background-color: #00008f; }
    table.brandbar td { padding: 9px 14px; vertical-align: middle; }
    .brand-sub { color: #ffffff; font-size: 11px; font-weight: bold; }
    .doc-type { color: #ffffff; font-size: 12px; font-weight: bold; }
    /* Barre rouge d'accent sous le bandeau (signature AXA). */
    table.accent { width: 100%; margin: 0; border-collapse: collapse; }
    table.accent td { background-color: #e60000; line-height: 6px; font-size: 1px; padding: 0; }

    /* ---------- Méta (référence / date) ---------- */
    .meta { color: #5c5c5c; font-size: 8.5px; margin: 0 0 6px 0; }

    /* ---------- Titres de section (bandeau réservé aux sections FDR) ---------- */
    h2 {
      color: #00008f;
      font-size: 12px;
      font-weight: bold;
      margin: 16px 0 0 0;
      padding: 6px 9px;
      background-color: #eaeaf6;
      border-left: 4px solid #00008f;
    }

    /* Corps d'attestation : contenu WYSIWYG libre. Les titres ne reprennent
       pas le bandeau de section et respectent la couleur choisie dans l'éditeur. */
    .attestation-body h1,
    .attestation-body h2,
    .attestation-body h3 {
      color: #00008f;
      background-color: transparent;
      border: none;
      padding: 0;
      margin: 12px 0 6px 0;
      font-weight: bold;
    }
    .attestation-body h1 { font-size: 15px; }
    .attestation-body h2 { font-size: 13px; }
    .attestation-body h3 { font-size: 11.5px; }

    /* ---------- Tableaux de données ---------- */
    table.data { width: 100%; border-collapse: collapse; margin: 0 0 4px 0; }
    table.data td {
      padding: 6px 9px;
      border-bottom: 1px solid #e3e3e3;
      vertical-align: top;
    }
    table.data td.label {
      color: #5c5c5c;
      width: 38%;
      background-color: #f7f7fb;
    }
    table.data td.value { color: #333333; }

    .pill {
      background-color: #eaeaf6;
      color: #00008f;
      font-size: 9px;
      font-weight: bold;
      padding: 2px 8px;
    }
    .pill-ok { background-color: #e3f3e8; color: #188138; }
    .pill-no { background-color: #fde6e6; color: #e60000; }

    /* ---------- Pied de page ---------- */
    .footer {
      color: #9a9a9a;
      font-size: 8px;
      border-top: 1px solid #e3e3e3;
      padding-top: 6px;
    }
    .footer table { width: 100%; }
  </style>
</head>
<body>
  <!-- En-tête répété -->
  <div id="header_content">
    <table class="brandbar">
      <tr>
        <td width="52" valign="middle" style="padding-right: 2px;"><img src="{{ logo_data_uri }}" width="46" height="46" alt="AXA" /></td>
        <td width="100%" valign="middle" style="padding-left: 6px;"><span class="brand-sub">Attestations de chantier</span></td>
        <td align="right" valign="middle">
          <span class="doc-type">{% block doc_title %}{% endblock %}</span>
        </td>
      </tr>
    </table>
    <table class="accent"><tr><td height="6">&nbsp;</td></tr></table>
  </div>

  <!-- Pied de page répété -->
  <div id="footer_content">
    <div class="footer">
      <table>
        <tr>
          <td>Plateforme Attestations de Chantier — AXA · Document à usage interne</td>
          <td align="right">Page <pdf:pagenumber /> / <pdf:pagecount /></td>
        </tr>
      </table>
    </div>
  </div>

  <!-- Contenu -->
  <p class="meta">
    Référence&nbsp;: <b>{{ demande.reference }}</b> &nbsp;·&nbsp; Généré le {% now "d/m/Y à H:i" %}
  </p>
  {% block content %}{% endblock %}
</body>
</html>

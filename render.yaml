# Déploiement backend sur Render (Infrastructure as Code).
services:
  - type: web
    name: attestations-api
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Base Postgres externe (Neon) — chaîne de connexion à coller dans le dashboard.
      - key: DATABASE_URL
        sync: false
      # Mot de passe des comptes de démo (seed) :
      - key: DEMO_PASSWORD
        sync: false
      # Stockage objet des pièces justificatives (Supabase Storage, S3-compatible)
      # — secrets à renseigner dans le dashboard Render :
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ACCESS_KEY_ID
        sync: false
      - key: AWS_S3_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      # À renseigner avec l'URL Vercel du front une fois déployé :
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
